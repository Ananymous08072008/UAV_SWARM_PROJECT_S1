# Scenario A - network degradation
# The busiest relay's radio degrades; the swarm must detect it and hand the role over.
scenario:
  name: network_degradation
  description: >
    While POI-A is being surveyed, the radio of the relay carrying the most traffic
    drops to 15 % quality at t = 120 s; it recovers at t = 300 s. Measures detection
    time, relay re-selection and recovery time.
  duration_s: 900.0
  seed: 42

area:                             # the operational center, the 75 m gap and the 1000 x 1000 m operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]   # the operational area

uavs:
  count: auto                     # sized to these PoIs (swarm/fleet_planner.py)
  min_count: 9
  max_count: 25
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # the launch pad around the operational center
  initial_battery_pct: 100.0

pois:
  - id: POI-A
    position_m: [420.0, 120.0]
    priority: 3
    survey_time_s: 90.0
  - id: POI-B
    position_m: [700.0, 440.0]
    priority: 4
    survey_time_s: 120.0

obstacles: []

timeline:
  - at_s: 120.0
    action: degrade_link
    params: {uav_id: critical_relay, quality: 0.15}

  - at_s: 300.0
    action: restore_link
    params: {uav_id: degraded_radio}
