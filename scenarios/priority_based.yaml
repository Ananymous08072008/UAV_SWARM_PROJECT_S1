# Priority-based survey with a small fleet
# ---------------------------------------------------------------------
# Real deployments rarely have one UAV per PoI. Here the fleet is sized to
# the fewest surveyors that can still finish every PoI before the deadline
# (uavs.count: auto), so PoIs outnumber surveyors and the swarm has to
# decide which PoI to fly next:
#   * priority comes from geography, not chance (core/world.py, _spatial_priorities):
#     PoIs that cluster together are surveyed as a group - the most central point of
#     a cluster is priority 5, its neighbours taper down with distance from the GCS;
#     an isolated PoI is worth less unless it is close enough to the GCS for a quick
#     look to be cheap (see random_pois.cluster_radius_m below);
#   * PoIs are taken highest effective priority first (priority + ageing,
#     swarm/priority_manager.py), so low-priority PoIs are delayed, not starved;
#   * a surveyor that finishes one PoI is re-tasked to the next in the queue;
#   * a high-priority PoI that appears while the surveyors are busy with
#     lower-priority ones pre-empts one of them.
# The 10 PoIs appear at random places and times (the mission constraints, see
# config/scenario.yaml), so the queue builds up and drains as they come in.
# `python main.py --scenario scenarios/priority_based.yaml --seed N` replays run N.

scenario:
  name: priority_based
  description: >
    A minimal fleet surveys 10 PoIs of mixed priority that appear at random places
    and times in the operational area, flying them one after another in priority
    order; a high-priority PoI that appears mid-mission pre-empts lower-priority work.
  duration_s: 2700.0              # 45 min mission
  seed: random

area:                             # the operational center, the 75 m gap and the 1000 x 1000 m operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]   # the operational area

uavs:
  count: auto                     # fewest surveyors that finish in time (not one per PoI)
  min_count: 9                    # never fewer: shortfall flown as spares
  max_count: 25
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # the launch pad around the operational center
  initial_battery_pct: 100.0
  battery_overrides: {}

pois: []

random_pois:
  count: 10
  region_m: [75.0, -500.0, 1075.0, 500.0]   # the operational area
  spawn_s: [0.0, 1800.0]                     # each appears at a random time in the first 30 min
  min_spacing_m: 120.0
  cluster_radius_m: 200.0    # PoIs this close to one another count as the same cluster
  survey_time_s: [40.0, 90.0]
  margin_m: 20.0

obstacles: []

timeline: []
