# Scenario C - early PoI completion
# A PoI is finished early; the freed UAV and the relays it needed are re-used.
scenario:
  name: poi_completion
  description: >
    POI-B, the farther PoI and so flown after POI-A, is declared complete at t = 300 s
    while it is still being surveyed. The released UAV becomes available and the
    relay chain that served it is torn down or re-tasked.
  duration_s: 900.0
  seed: 42

area:                             # the operational center, the 75 m gap and the 1000 x 1000 m operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]   # the operational area

uavs:
  count: auto                     # sized to these PoIs (swarm/fleet_planner.py)
  min_count: 9
  max_count: 25
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # the launch pad around the operational center
  initial_battery_pct: 100.0

pois:
  - id: POI-A
    position_m: [420.0, 120.0]
    priority: 3
    survey_time_s: 90.0
  - id: POI-B
    position_m: [640.0, 380.0]
    priority: 4
    survey_time_s: 120.0

obstacles: []

timeline:
  - at_s: 300.0
    action: complete_poi
    params: {poi_id: POI-B}
