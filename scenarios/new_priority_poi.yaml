# Scenario E - newly emerging high-priority region
# A priority-5 region appears mid-mission: a spare takes it, or a lower-priority
# survey is pre-empted if the spares cannot keep it connected.
scenario:
  name: new_priority_poi
  description: >
    While POI-A is being surveyed (and the farther POI-B waits its turn), a
    priority-5 region is reported at t = 120 s. Measures the response time to it.
  duration_s: 900.0
  seed: 42

area:                             # the operational center, the 75 m gap and the 1000 x 1000 m operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]   # the operational area

uavs:
  count: auto                     # sized to these PoIs, the reported region included
  min_count: 9
  max_count: 25
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # the launch pad around the operational center
  initial_battery_pct: 100.0

pois:
  - id: POI-A
    position_m: [420.0, 120.0]
    priority: 3
    survey_time_s: 90.0
  - id: POI-B
    position_m: [640.0, 380.0]
    priority: 4
    survey_time_s: 120.0

obstacles: []

timeline:
  - at_s: 120.0
    action: add_poi
    params: {id: POI-URGENT, position_m: [300.0, 450.0], priority: 5, survey_time_s: 50.0}
