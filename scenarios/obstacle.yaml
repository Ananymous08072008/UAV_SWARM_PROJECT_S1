# Scenario B - obstacle across the relay backbone
# Debris blocks the longest hop; the relay chain has to route around it.
scenario:
  name: obstacle
  description: >
    At t = 140 s, while POI-A is being surveyed, a 70 m tall obstacle with 40 dB
    attenuation appears on the longest hop of the backbone. The relay planner must
    find a detour and reconnect the survey UAVs.
  duration_s: 900.0
  seed: 42

area:                             # the operational center, the 75 m gap and the 1000 x 1000 m operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]   # the operational area

uavs:
  count: auto                     # sized to these PoIs (swarm/fleet_planner.py)
  min_count: 9
  max_count: 25
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # the launch pad around the operational center
  initial_battery_pct: 100.0

pois:
  - id: POI-A
    position_m: [420.0, 120.0]
    priority: 3
    survey_time_s: 90.0
  - id: POI-B
    position_m: [640.0, 380.0]
    priority: 4
    survey_time_s: 120.0

obstacles: []

timeline:
  - at_s: 140.0
    action: add_obstacle
    params: {id: DEBRIS-1, center_m: backbone_midpoint, size_m: 150.0, height_m: 70.0, attenuation_db: 40.0}
