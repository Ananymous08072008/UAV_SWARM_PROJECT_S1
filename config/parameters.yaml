# =====================================================================
# UAV SWARM PROJECT - physical and algorithm parameters
# ---------------------------------------------------------------------
# These values describe HOW the system behaves (vehicle limits, radio,
# algorithms). WHAT happens in a run (UAVs, PoIs, timeline) is in the
# scenario files.
#
# Units: metres, seconds, degrees, percent, dB, Mbit/s.
# Local frame is ENU: x = East, y = North, z = Up, origin = GCS.
# Unknown keys inside a section raise an error (typo protection).
# =====================================================================

simulation:
  dt_s: 0.1                 # physics step
  seed: 42                  # master RNG seed -> reproducible experiments
  status_interval_s: 30.0   # console status table period (main.py)
  event_history: 5000       # events kept in memory for the dashboard

# Geographic anchor for Mission Planner. Default = ArduPilot SITL home (CMAC).
geo_origin:
  lat_deg: -35.363261
  lon_deg: 149.165230
  alt_msl_m: 584.0

uav:
  cruise_speed_mps: 10.0
  max_accel_mps2: 3.0
  climb_rate_mps: 3.0
  arrival_radius_m: 2.0
  default_altitude_m: 40.0   # survey altitude if a PoI does not specify one
  rth_altitude_m: 80.0       # return-to-home transit altitude (above outbound survey/relay traffic)
  max_altitude_m: 100.0      # maximum operational height
  heading_min_speed_mps: 0.5

battery:
  hover_drain_pct_per_min: 5.0    # 100 % / 5 %/min = 1200 s: the longest a UAV can stay airborne
  cruise_drain_pct_per_min: 1.5   # EXTRA drain at cruise speed (~15 min flying at 10 m/s)
  low_pct: 30.0
  critical_pct: 15.0
  charge_rate_pct_per_min: 25.0   # battery swap / fast charge on the home pad
  resume_pct: 95.0

# --- swarm research network (simulation/communication.py) -------------
# Log-distance path loss + logistic PDR curve. With these values a healthy
# UAV-UAV link has its maximum range at 100 m (85 % PDR, the quality relays
# are planned for) and degrades beyond it: ~73 % at 110 m, ~59 % at 120 m,
# dropping out around 130 m. A UAV-GCS link reaches ~328 m at 85 % thanks to
# the high-gain ground antenna.
communication:
  tx_power_dbm: 12.6
  uav_antenna_gain_dbi: 0.0
  gcs_antenna_gain_dbi: 13.4
  gcs_antenna_height_m: 10.0
  path_loss_ref_db: 40.0
  path_loss_exponent: 2.6
  noise_floor_dbm: -90.0
  snr_mid_db: 8.0           # SNR giving 50 % PDR
  snr_slope_db: 1.5
  fading_sigma_db: 1.0      # shadow fading per measurement
  pdr_smoothing: 0.4        # EWMA weight of the newest measurement
  link_up_pdr: 0.55         # hysteresis: a link comes up here ...
  link_down_pdr: 0.45       # ... and drops out here
  hop_latency_ms: 5.0
  retx_latency_ms: 8.0
  update_interval_s: 0.5

# --- imagery / situational data (simulation/data_model.py) ------------
data:
  imagery_rate_mbps: 3.0
  link_capacity_mbps: 40.0
  buffer_capacity_mb: 4000.0
  pad_download_mbps: 100.0
  live_delay_s: 10.0          # imagery delivered within 10 s counts as live

# --- swarm intelligence (swarm/*) -------------------------------------
swarm:
  decision_interval_s: 1.0
  backup_enabled: true
  backup_min_battery_pct: 60.0
  data_ferry: true            # disconnected UAVs carry data back themselves

  # Fleet sizing for scenarios with `uavs: {count: auto}` (swarm/fleet_planner.py):
  # the fewest surveyors that finish every PoI in time (one after another by priority)
  # + relays to keep the first wave connected + the terms below.
  fleet:
    spares: 1                 # standby UAVs: parked backup / relay handover replacement
    fault_reserve: true       # +1 per scheduled UAV loss and per new PoI of unknown position
    time_budget_fraction: 0.75  # the PoI schedule may fill 75 % of the mission time
    relay_chain: true           # false = no relays, surveyors carry data home (smallest fleet)

  routing:
    hysteresis: 0.15          # keep the current next hop while within 15 % of the best
    min_link_pdr: 0.7         # weaker links are used only when nothing else reaches the GCS
    weak_link_penalty: 10.0   # extra cost (transmissions) of a weak link

  allocation:
    reserve_pct: 10.0         # battery kept for the trip home
    battery_weight_s: 2.0     # seconds of travel that 1 % of battery is worth
    relaxed_reserve_pct: 4.0  # fallback reserve when no UAV clears reserve_pct for a PoI
    ferry_min_priority: 4     # priority >= this may ferry (store-and-forward) before the deadline crunch ...
    ferry_min_blocked_s: 60.0    # ... once continuously blocked at least this long, not on one tight tick
    ferry_deadline_margin_s: 600.0  # any blocked PoI may ferry once this little mission time is left

  relay:
    relay_altitude_m: 60.0
    min_planned_pdr: 0.85     # planned quality of every hop
    spacing_safety: 0.9
    reposition_threshold_m: 25.0
    min_battery_pct: 35.0
    replan_interval_s: 10.0
    stickiness_s: 30.0        # bonus for keeping the relay that is already there
    lookahead_pois: 3         # queued PoIs to plan a head start for, beyond the ones being surveyed now
    max_lookahead_relays: 3   # cap on extra relays spent pre-positioning for them

  energy:
    reserve_pct: 8.0
    handover: true
    handover_margin_pct: 6.0
    max_handover_wait_s: 60.0
    idle_recharge_below_pct: 60.0
    idle_recharge_after_s: 20.0
    park_when_idle: true      # IDLE with nothing to do -> land and top up instead of hovering still

  priority:
    ageing_per_min: 0.25      # waiting PoIs slowly gain priority (no starvation)
    max_ageing_bonus: 1.5
    preempt: true
    preempt_min_priority: 4
    preempt_priority_gap: 2

  safety:
    min_separation_m: 20.0    # two airborne UAVs closer than this collide (both are lost)
    altitude_floor_m: 20.0    # flight levels 20, 40, 60, 80, 100 m (up to uav.max_altitude_m)
    layer_spacing_m: 20.0     # >= min_separation_m, so UAVs on different levels never collide
    alert_distance_m: 30.0    # predicted to pass closer than this horizontally -> separate vertically
    conflict_horizon_s: 12.0  # how far ahead collisions are predicted
    obstacle_clearance_m: 10.0
    recall_at_deadline: true
    recall_margin_s: 30.0

  reconfiguration:
    enabled: true
    anomaly_ratio: 0.6        # measured/predicted PDR below this = anomalous link
    min_predicted_pdr: 0.5
    detection_window_s: 2.0
    failure_timeout_s: 2.0    # heartbeat loss before a UAV is declared lost
    recovery_pdr: 0.7
    incident_timeout_s: 300.0
    disconnect_backoff_s: 15.0  # re-plan a cut-off surveyor at most this often

# --- MAVLink telemetry to Mission Planner (telemetry/*) ---------------
telemetry:
  target_host: 127.0.0.1
  target_port: 14550
  bind_port: 0                # 0 = any free local port
  statustext_events: true     # show swarm decisions in the Mission Planner message pane
  rates_hz:
    HEARTBEAT: 1.0
    GLOBAL_POSITION_INT: 5.0
    ATTITUDE: 5.0
    VFR_HUD: 2.0
    SYS_STATUS: 1.0
    GPS_RAW_INT: 1.0
    SWARM_STATUS: 1.0         # NAMED_VALUE_FLOAT: role, link quality, hop count
    HOME_POSITION: 0.2        # each vehicle's home pad

# --- dashboard (dashboard/*) ------------------------------------------
dashboard:
  host: 127.0.0.1
  port: 8000
  push_interval_s: 0.2
