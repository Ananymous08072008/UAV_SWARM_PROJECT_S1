# =====================================================================
# Full demonstration scenario - search and survey under the mission constraints
# ---------------------------------------------------------------------
# Layout (local ENU metres, origin = the operational center / GCS):
#
#   operational center          75 m        operational area, 1000 m x 1000 m
#   (GCS + launch pad, 0, 0) <----------->  x = 75 .. 1075, y = -500 .. 500
#
# Every UAV takes off from and lands back at the operational center, and all
# are down by the end of the 45-minute mission. 10 PoIs appear at random places
# in the operational area, each at a random time in the first 30 minutes; the
# swarm knows nothing about a PoI until it appears. With a 100 m radio range
# (config/parameters.yaml) every survey beyond the first ~80 m reports through
# a relay chain. The timeline also injects faults so the swarm is seen
# recovering from them. Focused single-event scenarios live in scenarios/.
# =====================================================================

scenario:
  name: full_demo
  description: >
    10 PoIs appear at random places and times (first 30 min) in a 1000 x 1000 m
    operational area 75 m from the operational center. With a 100 m radio range
    and 5 m/s top speed the swarm surveys each one through relay chains and
    lands every UAV by 45 min, while radio degradation, debris across the relay
    backbone, an early PoI completion, a UAV loss and a relay running low on
    battery each strike at a random time within their window.
  duration_s: 2700.0              # 45 min mission
  # "random" draws a new seed every run. It is printed at start-up and saved
  # in summary.json; `python main.py --seed N` replays that exact run.
  seed: random

area:                             # geofence: the center, the 75 m gap and the operational area
  x_min_m: -200.0
  x_max_m: 1100.0
  y_min_m: -550.0
  y_max_m: 550.0

gcs:
  position_m: [0.0, 0.0, 0.0]     # the operational center

# The operational area, drawn on the dashboard map.
disaster_zone: [[75, -500], [1075, -500], [1075, 500], [75, 500]]

# count: auto sizes the fleet to the mission: the fewest surveyors that finish
# every PoI in time, the relays that keep the deepest PoI connected to the GCS,
# spares for relay handovers, and a reserve for the scheduled UAV loss below
# (tuned in parameters.yaml, swarm.fleet). A number instead fixes the fleet.
uavs:
  count: auto
  min_count: 9                    # never fewer: shortfall flown as spares
  max_count: 25                   # the far corner alone needs a chain of ~13 relays
  formation: grid
  per_row: 5
  spacing_m: 30.0                 # >= swarm.safety.min_separation_m, or neighbours collide on take-off
  start_m: [-75.0, -60.0]         # a 5 x 5 pad around the operational center, clear of the operational area
  initial_battery_pct: 100.0
  battery_overrides: {}

# No fixed PoIs: every run draws where the 10 PoIs are, when each appears and
# how long it takes to survey. Priority follows from where they land (spatial
# clustering, core/world.py) rather than being drawn too.
pois: []

random_pois:
  count: 10
  region_m: [75.0, -500.0, 1075.0, 500.0]    # the operational area
  spawn_s: [0.0, 1800.0]                      # each appears at a random time in the first 30 min
  min_spacing_m: 150.0                        # no two PoIs on top of each other
  cluster_radius_m: 250.0                     # PoIs this close to one another count as the same cluster
  survey_time_s: [45.0, 90.0]
  margin_m: 20.0

obstacles: []

# Every event fires at a random time inside its [earliest, latest] window, drawn
# from the run seed. The windows overlap, so the order changes between runs too.
#
# Why the windows sit where they do: events aimed at a relay (critical_relay,
# role:RELAY, backbone_midpoint) need a relay chain to exist, and chains only
# exist while a PoI that has already appeared is being surveyed - PoIs keep
# appearing for 30 minutes, with quiet spells in between. The windows open once
# the first PoIs have usually appeared and stay open for most of that time; a
# windowed trigger that finds no target keeps retrying until one exists.
timeline:
  # Scenario A - the busiest relay's radio degrades
  - at_s: [300.0, 1500.0]
    action: degrade_link
    params: {uav_id: critical_relay, quality: 0.15}

  # Scenario C - a PoI is finished early (enough imagery already collected);
  # random_active picks one under survey at that moment
  - at_s: [300.0, 1700.0]
    action: complete_poi
    params: {poi_id: random_active}

  # Scenario B - debris blocks the longest hop of the relay backbone
  - at_s: [300.0, 1500.0]
    action: add_obstacle
    params: {id: DEBRIS-1, center_m: backbone_midpoint, size_m: 140.0, height_m: 70.0, attenuation_db: 40.0}

  # A UAV is lost while the relay chain is under strain
  - at_s: [300.0, 1500.0]
    action: fail_uav
    params: {uav_id: critical_relay, reason: "motor failure"}

  # A relay runs low on battery -> it asks for a replacement and hands over (or,
  # if it is too far out to wait, heads straight home and the chain is re-planned)
  - at_s: [300.0, 1500.0]
    action: set_battery
    params: {uav_id: "role:RELAY", battery_pct: 25.0}
